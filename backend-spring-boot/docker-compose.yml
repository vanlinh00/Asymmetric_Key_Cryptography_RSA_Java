services:
  auth-service:
    build:
      context: ./auth-service
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
    volumes:
      - ./certs/private.pem:/app/certs/private.pem:ro

  resource-service:
    build:
      context: ./resource-service
    ports:
      - "8082:8082"
    environment:
      - SERVER_PORT=8082
    volumes:
      - ./certs/public.pem:/app/certs/public.pem:ro
    depends_on:
      - auth-service
